status = error
name = PropertiesConfig

# Root logger - writes to file
log4j.rootLogger=DEBUG, file, console

# Appender which writes to console  
log4j.appender.console=org.apache.log4j.ConsoleAppender  
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{MM-dd-yyyy HH:mm:ss} %F %-5p [%t] %c{2} %L - %m%n
  
# File appender for Selenium logs
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=C:/Abhi/Practice/SwagLabs/src/test/resources/logs/Selenium.log
log4j.appender.file.Append=false
log4j.appender.file.maxFileSize=5000KB
log4j.appender.file.maxBackupIndex=1
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%-7p %d [%t] %c %x - %m%n

# Application-specific logger (devpinoyLogger) - writes to dest1
log4j.logger.devpinoyLogger=DEBUG, dest1

log4j.appender.dest1=org.apache.log4j.RollingFileAppender
log4j.appender.dest1.File=C:/Abhi/Practice/SwagLabs/src/test/resources/logs/Application.log
log4j.appender.dest1.Append=false
log4j.appender.dest1.maxFileSize=5000KB
log4j.appender.dest1.maxBackupIndex=1
log4j.appender.dest1.layout=org.apache.log4j.PatternLayout
log4j.appender.dest1.layout.ConversionPattern=%-7p %d [%t] %c %x - %m%n